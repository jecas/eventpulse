name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eventpulse
          POSTGRES_USER: eventpulse
          POSTGRES_PASSWORD: eventpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventpulse -d eventpulse"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://eventpulse:eventpulse@localhost:5432/eventpulse

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -v
      - name: Build API/worker image
        run: docker build -t eventpulse:test .
      - name: Build mock external image
        run: docker build -f mock_external/Dockerfile -t eventpulse-mock:test .

  e2e:
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in {1..40}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' eventpulse-api-1 2>/dev/null || echo starting)
            echo "API health: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            [ "$STATUS" = "unhealthy" ] && docker compose logs api --no-color && exit 1
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: E2E
        run: python scripts/e2e_test.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
